server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'app'
      - source_labels: ['__meta_docker_container_label_workload']
        target_label: 'workload'

    pipeline_stages:
      - regex:
          expression: '(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) (?P<level_emoji>[🔑🔒🛡️📤🎉✅⚠️❌])?\s*(?P<message>.*)'
      - regex:
          expression: '(?P<client_spiffe_id>spiffe://[a-zA-Z0-9\.\-_/]+)'
      - regex:
          expression: '(?P<event_tag>\[[A-Z0-9_\-]+\])'
      - labels:
          client_spiffe_id:
          event_tag:
